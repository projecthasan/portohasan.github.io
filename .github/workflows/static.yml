# Build dan deploy situs statis ke GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Tidak ada package-lock.json, jadi pakai npm install (bukan npm ci)
      - name: Install dependencies
        run: npm install

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: npm run build

      # Cari folder hasil build yang berisi index.html
      - name: Find static output
        run: |
          for d in dist/client .output/public dist; do
            if [ -f "$d/index.html" ]; then
              echo "SITE_DIR=$d" >> "$GITHUB_ENV"; exit 0
            fi
          done
          echo "index.html tidak ditemukan"; find . -name index.html -not -path "./node_modules/*"; exit 1

      - name: SPA fallback & nojekyll
        run: |
          cp "$SITE_DIR/index.html" "$SITE_DIR/404.html"
          touch "$SITE_DIR/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
